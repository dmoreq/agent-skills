name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-xdist pyyaml

      - name: Run schema and invariant tests
        run: python -m pytest -n 4 tests/ -v

      - name: Run setup script tests
        run: bash tests/test_setup_script.sh
